services:
  db:
    image: postgres:16
    container_name: passe-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: passe
      POSTGRES_USER: passe
      POSTGRES_PASSWORD: passe_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passe -d passe"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
